name: AI Issue Analysis

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to analyze"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-issue-analysis-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@github-actions'))
    runs-on: ubuntu-latest

    steps:
      - name: Validate Copilot token
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Repository secret COPILOT_GITHUB_TOKEN is missing or empty."
            exit 1
          fi

      - name: Analyze issue with AI
        id: analysis
        uses: MistEO/ai-issue-analysis@b456da9504e7db434ce24080e85118897b83a055
        with:
          agent: copilot
          api-key: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          bot-name: "@github-actions"
          issue-number: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || '' }}
          # `auto` 由 Copilot CLI 根据账号策略选择当前可用模型；留空会被
          # 上游 Action 回退为固定的 gpt-5.4，可能不在当前账号的模型列表中。
          model: ${{ vars.COPILOT_MODEL || 'auto' }}
          agent-extra-args: ${{ vars.COPILOT_AGENT_EXTRA_ARGS || '' }}
          initial-comment-body: |
            🤖 正在分析这个 Issue，预计需要数分钟。
            我会持续更新分析过程，并在结束后给出修复建议。
          prompt-template: |
            你正在分析 GitHub 仓库 {{repository}} 的 Issue #{{issue_number}}。

            要求：
            1. 先复述问题和复现条件；
            2. 基于仓库代码、配置和日志定位最可能根因；
            3. 明确区分“已验证事实”和“推测”；
            4. 给出最小修复方案和验证步骤；
            5. 若证据不足，列出需要用户补充的材料。

            把最终结论写到 {{answer_file}}。
          comment-prompt-template: |
            用户补充要求：{{comment_body}}

      - name: Upload local debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-issue-analysis-summary
          path: |
            .cache/analysis_prompt.txt
            .cache/agent_output.txt
            .cache/final_conclusion.md
          if-no-files-found: warn
